<title>Upping My P(doom)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --ground:#1E1530; --panel:#2B2042; --line:#3E2F5C;
    --ink:#F7EEFF; --muted:#B9A9D8; --clay:#D97757; --butter:#FFD65C;
  }
  html,body{height:100%}
  body{background:var(--ground);color:var(--ink);font:600 15px/1.5 Nunito,system-ui,sans-serif;padding-inline:16px}
  .wrap{max-width:1180px;margin:0 auto;padding-block:20px 32px;display:flex;flex-direction:column;gap:14px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:8px 20px;flex-wrap:wrap}
  h1{font-family:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:400;font-size:clamp(28px,5vw,46px);margin:0;line-height:1;color:var(--clay);text-wrap:balance}
  h1 span{color:var(--butter)}
  header p{margin:0;color:var(--muted)}
  .stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 0 0 4px var(--line),0 24px 60px -24px rgba(0,0,0,.7)}
  .stage:fullscreen{border-radius:0;box-shadow:none;aspect-ratio:auto}
  canvas{display:block;width:100%;height:100%}
  .start{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:0 0 7%;background:transparent;border:0;cursor:pointer;font:inherit;color:inherit}
  .start span{font-family:"Bagel Fat One",system-ui,sans-serif;font-size:clamp(16px,3vw,30px);background:var(--butter);color:#3A2440;padding:.45em 1.3em .5em;border-radius:999px;box-shadow:0 6px 0 #3A2440;transition:transform .15s}
  .start:hover span,.start:focus-visible span{transform:translateY(-3px) scale(1.04)}
  .start:focus-visible{outline:none}
  .start:focus-visible span{outline:3px solid #fff;outline-offset:4px}
  .bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--panel);border-radius:14px;padding:10px 14px}
  .ctl{font:800 14px/1 Nunito,system-ui,sans-serif;color:var(--ink);background:var(--line);border:0;border-radius:10px;padding:10px 14px;cursor:pointer;min-width:44px}
  .ctl:hover{background:#4D3B72}
  .ctl:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
  .ctl[aria-pressed="true"]{background:var(--clay);color:#241530}
  #play{background:var(--clay);color:#241530;min-width:84px}
  #scrub{flex:1 1 200px;min-width:0;accent-color:var(--clay)}
  .time{font-family:Silkscreen,"Courier New",monospace;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  footer{display:flex;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;color:var(--muted);font-size:13px}
  footer a{color:var(--butter)}
  kbd{font-family:Silkscreen,"Courier New",monospace;font-size:11px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--ink)}
  #taps{font-family:Silkscreen,monospace;font-size:12px;color:var(--butter);white-space:pre-wrap;margin:0}
</style>

<div class="wrap">
  <header>
    <h1>I'm upping my <span>P(doom)</span></h1>
    <p>A pixel-Clawd dance party, synced to the song.</p>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" width="1280" height="720" aria-label="Animated music video: pixel Clawd dancing through scenes from the song"></canvas>
    <button class="start" id="start" aria-label="Play the song"><span>▶&nbsp; Press play</span></button>
  </div>

  <div class="bar">
    <button class="ctl" id="play">▶ Play</button>
    <input type="range" id="scrub" min="0" max="156.6" step="0.01" value="0" aria-label="Seek">
    <span class="time" id="time">0:00 / 2:36</span>
    <button class="ctl" id="lyr" aria-pressed="true" title="Toggle lyrics (L)">Lyrics</button>
    <button class="ctl" id="fs" title="Fullscreen">⛶</button>
  </div>

  <footer>
    <span>Song &amp; original video by <a href="https://x.com/slimer48484/status/2097752569212756134" target="_blank" rel="noopener">@slimer48484</a></span>
    <span><kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> seek · <kbd>L</kbd> lyrics · <kbd>D</kbd> timing debug</span>
  </footer>
  <pre id="taps" hidden></pre>
</div>

<audio id="au" src="pdoom.mp3" preload="auto"></audio>

<script>
(() => {
const cv = document.getElementById('cv'), c = cv.getContext('2d');
const au = document.getElementById('au');
const W = 1280, H = 720, TAU = Math.PI * 2;
const BPM = 88, BEAT = 60 / BPM, OFF = 0.21, DUR = 156.6;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const K = {
  ink:'#3A2440', clay:'#D97757', clayDk:'#B35A3C', clayLt:'#EFA283', eye:'#2A1A12',
  cream:'#FFF6E9', pink:'#FFB3C7', mint:'#A8E6CF', butter:'#FFD65C', red:'#FF5D6C',
  lilac:'#CDB4FF', sky:'#BFE3FF', teal:'#7FD4C1'
};

// ---------- utils ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, x) => a + (b - a) * x;
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const backOut = x => { x = clamp(x); const s = 1.9; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const R = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const bpOf = t => (t - OFF) / BEAT;
let rt = 0, BP = 0;

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function circ(x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, TAU); }
function ell(x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, TAU); }
function shape(fill, lw = 6, stroke = K.ink) {
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (lw) { c.lineWidth = lw; c.strokeStyle = stroke; c.lineJoin = 'round'; c.stroke(); }
}
function bg(a, b) { const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, a); g.addColorStop(1, b); c.fillStyle = g; c.fillRect(-300, -300, W + 600, H + 600); }
function font(sz, fam = 'B') {
  c.font = fam === 'B' ? `${sz}px "Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif`
         : fam === 'P' ? `${sz}px Silkscreen,"Courier New",monospace`
         : `800 ${sz}px Nunito,system-ui,sans-serif`;
}
function say(str, x, y, sz, fill = K.cream, o = {}) {
  font(sz, o.fam || 'B'); c.textAlign = o.align || 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  if (o.lw !== 0) { c.lineWidth = o.lw ?? sz * 0.2; c.strokeStyle = o.stroke || K.ink; c.strokeText(str, x, y); }
  c.fillStyle = fill; c.fillText(str, x, y);
}
function wobbleText(str, x, y, sz, fill, t, o = {}) {
  font(sz, o.fam || 'B');
  const w = c.measureText(str).width; let cx = x - w / 2;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i]; const cw = c.measureText(ch).width;
    const ap = o.pop != null ? backOut((o.pop - i * 0.05) * 4) : 1;
    if (ap > 0.01 && ch !== ' ') {
      c.save(); c.translate(cx + cw / 2, y + Math.sin(t * 7 + i * 0.7) * (o.amp ?? 4));
      c.scale(ap, ap); c.rotate(Math.sin(t * 4 + i) * 0.05);
      say(ch, 0, 0, sz, Array.isArray(fill) ? fill[i % fill.length] : fill, { lw: sz * 0.2, fam: o.fam });
      c.restore();
    }
    cx += cw;
  }
}
function sunburst(cx, cy, n, c1, c2, rot) {
  c.fillStyle = c1; c.fillRect(-300, -300, W + 600, H + 600); c.fillStyle = c2;
  for (let i = 0; i < n; i++) { const a = rot + i * TAU / n; c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, 1800, a, a + TAU / n / 2); c.closePath(); c.fill(); }
}
function glow(x, y, r, col, a = 1) {
  const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.save(); c.globalAlpha = a; c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2); c.restore();
}
function floor(y, col) { c.fillStyle = col; c.fillRect(-300, y, W + 600, H - y + 300); c.fillStyle = K.ink; c.fillRect(-300, y - 3, W + 600, 6); }
function puffs(arr, fill, lw = 6) {
  c.fillStyle = K.ink; for (const [x, y, r] of arr) { circ(x, y, r + lw / 2); c.fill(); }
  c.fillStyle = fill; for (const [x, y, r] of arr) { circ(x, y, r - lw / 2); c.fill(); }
}
function cloud(x, y, s, fill = '#fff') { puffs([[x - 50 * s, y + 8 * s, 36 * s], [x, y - 12 * s, 50 * s], [x + 52 * s, y + 6 * s, 38 * s], [x + 5 * s, y + 18 * s, 40 * s]], fill, 5); }
function star4(x, y, r) { c.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 - Math.PI / 2; const q = i % 2 ? r * 0.35 : r; c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } c.closePath(); }
function heart(x, y, s) { c.beginPath(); c.moveTo(x, y + s); c.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.6, y - s * 1.1, x, y - s * 0.45); c.bezierCurveTo(x + s * 0.6, y - s * 1.1, x + s * 1.4, y - s * 0.1, x, y + s); c.closePath(); }
function bubble(x, y, txt, sz = 26, tx, ty, fill = K.cream) {
  font(sz, 'N'); const w = c.measureText(txt).width + sz * 1.3, h = sz * 1.9;
  rr(x - w / 2, y - h / 2, w, h, h / 2); shape(fill, 5);
  if (tx != null) {
    c.beginPath(); c.moveTo(x - 14, y + h / 2 - 5); c.lineTo(tx, ty); c.lineTo(x + 14, y + h / 2 - 5); c.fillStyle = fill; c.fill();
    c.beginPath(); c.moveTo(x - 14, y + h / 2); c.lineTo(tx, ty); c.lineTo(x + 14, y + h / 2); c.lineWidth = 5; c.strokeStyle = K.ink; c.stroke();
  }
  c.fillStyle = K.ink; c.textAlign = 'center'; c.textBaseline = 'middle'; font(sz, 'N'); c.fillText(txt, x, y + 1);
}
function confetti(t, n, speed = 160) {
  const cols = [K.pink, K.butter, K.mint, K.lilac, K.sky, K.clay];
  for (let i = 0; i < n; i++) {
    const x = R(i) * W + Math.sin(t * 2 + i) * 24, y = ((t * speed * (0.6 + R(i + 9)) + R(i + 3) * (H + 60)) % (H + 60)) - 30;
    c.save(); c.translate(x, y); c.rotate(t * 3 + i); c.scale(1, Math.cos(t * 5 + i));
    c.fillStyle = cols[i % cols.length]; c.fillRect(-7, -4, 14, 8); c.restore();
  }
}
function shakeBy(a) { if (!REDUCED && a > 0) c.translate((R(Math.floor(rt * 40)) - .5) * a, (R(Math.floor(rt * 40) + 7) - .5) * a); }
function stamp(txt, x, y, lt, rot = -0.18, col = '#E23D55', sz = 64) {
  if (lt < 0) return; const k = lt < 0.18 ? lerp(2.6, 1, ease(lt / 0.18)) : 1;
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(k, k); c.globalAlpha = clamp(lt / 0.1);
  font(sz); const w = c.measureText(txt).width + 44;
  rr(-w / 2, -sz * 0.75, w, sz * 1.5, 14); c.lineWidth = 8; c.strokeStyle = col; c.stroke();
  say(txt, 0, 4, sz, col, { lw: 0 }); c.restore();
}

// ---------- Clawd ----------
function clawd(x, y, s, o = {}) {
  const P = s, dy = (o.dy || 0) * s;
  c.save(); c.translate(x, y);
  if (!o.noShadow) { c.save(); c.globalAlpha = .22; c.fillStyle = K.ink; const f = 1 - Math.min(.5, Math.abs(o.dy || 0) * 0.06); ell(0, 0, s * 5.8 * f, s * 1.1 * f); c.fill(); c.restore(); }
  c.translate(0, dy);
  if (o.rot) c.rotate(o.rot);
  const sq = o.sq || 0; c.scale((o.flip ? -1 : 1) * (o.sx ?? 1) * (1 + sq * .6), 1 - sq);
  const col = o.col || K.clay, dk = o.dk || K.clayDk;
  // legs
  c.fillStyle = dk;
  [-4, -2, 1, 3].forEach((lx, i) => {
    let h = 2;
    if (o.walk != null) { const ph = Math.sin((o.walk + (i % 2 ? .5 : 0)) * TAU); if (ph > 0) h = 2 - ph * .9; }
    c.fillRect(lx * P, -2.05 * P, P, h * P + .05 * P);
  });
  // body
  c.fillStyle = dk; c.fillRect(-5 * P, -8 * P, 10 * P, 6 * P);
  c.fillStyle = col; c.fillRect(-5 * P, -8 * P, 10 * P, 5 * P);
  c.fillStyle = o.lt || K.clayLt; c.fillRect(-5 * P, -8 * P, 10 * P, P * .55);
  // arms
  const arm = (side, a) => { c.save(); c.translate(side * 5 * P, -4.5 * P); c.rotate(side < 0 ? a : -a); c.fillStyle = col; c.fillRect(side < 0 ? -2.05 * P : -.05 * P, -.5 * P, 2.1 * P, P); c.restore(); };
  arm(-1, o.aL || 0); arm(1, o.aR || 0);
  if (o.blush) { c.fillStyle = 'rgba(255,120,150,.55)'; c.fillRect(-4.6 * P, -4.9 * P, 1.4 * P, .7 * P); c.fillRect(3.2 * P, -4.9 * P, 1.4 * P, .7 * P); }
  if (o.hat === 'mask') { c.fillStyle = '#7A4FD6'; c.beginPath(); c.moveTo(-5.4 * P, -7.6 * P); c.lineTo(5.4 * P, -7.6 * P); c.lineTo(4.4 * P, -4.6 * P); c.lineTo(.6 * P, -5.4 * P); c.lineTo(-.6 * P, -5.4 * P); c.lineTo(-4.4 * P, -4.6 * P); c.closePath(); c.fill(); c.fillStyle = K.butter; star4(-5.4 * P, -7.6 * P, P * .8); c.fill(); star4(5.4 * P, -7.6 * P, P * .8); c.fill(); }
  // eyes
  const e = o.eyes || 'normal';
  const blink = e === 'normal' && ((rt * 0.9 + (o.seed || 0) * 1.7) % 3.3) < 0.13;
  if (e === 'shades') {
    rr(-4.4 * P, -7.4 * P, 8.8 * P, 2.1 * P, .6 * P); c.fillStyle = '#1A1320'; c.fill();
    c.fillStyle = 'rgba(255,255,255,.7)'; c.fillRect(-3.6 * P, -7 * P, 1.4 * P, .35 * P); c.fillRect(1 * P, -7 * P, 1.4 * P, .35 * P);
  } else for (const ex of [-3, 2]) {
    const X = ex * P, Y = -7 * P;
    c.fillStyle = K.eye;
    if (e === 'normal') { if (blink) c.fillRect(X - .1 * P, Y + 1.5 * P, 1.2 * P, .45 * P); else c.fillRect(X, Y, P, 2 * P); }
    else if (e === 'happy') { c.strokeStyle = K.eye; c.lineWidth = P * .55; c.lineCap = 'square'; c.lineJoin = 'miter'; c.beginPath(); c.moveTo(X - .35 * P, Y + 1.6 * P); c.lineTo(X + .5 * P, Y + .6 * P); c.lineTo(X + 1.35 * P, Y + 1.6 * P); c.stroke(); c.lineCap = 'butt'; }
    else if (e === 'scared') { c.fillStyle = '#fff'; c.fillRect(X - .45 * P, Y - .1 * P, 1.9 * P, 2.2 * P); c.fillStyle = K.eye; c.fillRect(X + .2 * P, Y + .6 * P, .6 * P, .8 * P); }
    else if (e === 'closed') { c.fillRect(X - .25 * P, Y + 1.2 * P, 1.5 * P, .45 * P); }
    else if (e === 'x') { c.strokeStyle = K.eye; c.lineWidth = P * .4; c.beginPath(); c.moveTo(X - .3 * P, Y + .2 * P); c.lineTo(X + 1.3 * P, Y + 1.8 * P); c.moveTo(X + 1.3 * P, Y + .2 * P); c.lineTo(X - .3 * P, Y + 1.8 * P); c.stroke(); }
    else if (e === 'swirl') { c.strokeStyle = K.eye; c.lineWidth = P * .25; c.beginPath(); for (let k = 0; k < 24; k++) { const a = k * .55 + rt * 6 * (ex < 0 ? 1 : -1), r = k * .045 * P; c.lineTo(X + .5 * P + Math.cos(a) * r, Y + P + Math.sin(a) * r); } c.stroke(); }
    else if (e === 'spark') { c.save(); c.shadowColor = '#FFE066'; c.shadowBlur = P * 1.4; c.fillStyle = '#FFF6A8'; star4(X + .5 * P, Y + P, P * 1.35 * (1 + .15 * Math.sin(rt * 12))); c.fill(); c.restore(); }
    else if (e === 'red') { c.save(); c.shadowColor = '#FF2244'; c.shadowBlur = P * 2; c.fillStyle = '#FF3355'; c.fillRect(X - .1 * P, Y, 1.2 * P, 2 * P); c.fillStyle = '#FFD0D8'; c.fillRect(X + .3 * P, Y + .3 * P, .4 * P, .6 * P); c.restore(); }
    else if (e === 'heart') { c.fillStyle = '#FF5C8A'; heart(X + .5 * P, Y + .9 * P, .75 * P); c.fill(); }
  }
  if (o.mouth === 'o') { c.fillStyle = K.eye; c.fillRect(-.5 * P, -4.4 * P, P, .9 * P); }
  // hats
  const h = o.hat, lw = P * .35;
  if (h === 'party') { c.beginPath(); c.moveTo(-1.7 * P, -8 * P); c.lineTo(0, -12.6 * P); c.lineTo(1.7 * P, -8 * P); c.closePath(); shape('#FF8FB1', lw); circ(0, -12.6 * P, .75 * P); shape(K.butter, lw); }
  else if (h === 'hard') { c.beginPath(); c.arc(0, -8 * P, 3.4 * P, Math.PI, 0); c.closePath(); shape('#FFD23F', lw); rr(-4.8 * P, -8.5 * P, 9.6 * P, .9 * P, .4 * P); shape('#FFD23F', lw); }
  else if (h === 'crown') { c.beginPath(); c.moveTo(-3 * P, -8 * P); c.lineTo(-3 * P, -10.6 * P); c.lineTo(-1.5 * P, -9.2 * P); c.lineTo(0, -11 * P); c.lineTo(1.5 * P, -9.2 * P); c.lineTo(3 * P, -10.6 * P); c.lineTo(3 * P, -8 * P); c.closePath(); shape('#FFC93C', lw); }
  else if (h === 'band') { c.fillStyle = '#FF5D6C'; c.fillRect(-5 * P, -8.1 * P, 10 * P, .8 * P); c.save(); c.translate(5 * P, -7.7 * P); c.rotate(.4 + Math.sin(rt * 14) * .25); c.fillRect(0, -.3 * P, 2.4 * P, .6 * P); c.restore(); }
  else if (h === 'halo') { c.save(); c.shadowColor = '#FFF2A0'; c.shadowBlur = P * 2; ell(0, -10.2 * P, 3.2 * P, .8 * P); c.lineWidth = P * .5; c.strokeStyle = '#FFE680'; c.stroke(); c.restore(); }
  else if (h === 'wizard') { c.beginPath(); c.moveTo(-3.8 * P, -8 * P); c.lineTo(.8 * P, -14.5 * P); c.lineTo(3.8 * P, -8 * P); c.closePath(); shape('#5B6CFF', lw); c.fillStyle = K.butter; star4(0, -10.5 * P, P); c.fill(); }
  else if (h === 'top') { rr(-2.6 * P, -12.4 * P, 5.2 * P, 4.2 * P, .3 * P); shape('#231A2E', lw); c.fillStyle = '#E23D55'; c.fillRect(-2.6 * P, -9.4 * P, 5.2 * P, .8 * P); rr(-3.8 * P, -8.5 * P, 7.6 * P, .8 * P, .3 * P); shape('#231A2E', lw); }
  else if (h === 'bowtie') { c.fillStyle = '#FF5C8A'; c.beginPath(); c.moveTo(0, -2.7 * P); c.lineTo(-1.4 * P, -3.4 * P); c.lineTo(-1.4 * P, -2 * P); c.closePath(); c.moveTo(0, -2.7 * P); c.lineTo(1.4 * P, -3.4 * P); c.lineTo(1.4 * P, -2 * P); c.closePath(); c.fill(); }
  c.restore();
}

function move(style, t, seed = 0) {
  const bp = bpOf(t), bi = Math.floor(bp), bf = bp - bi, hit = Math.max(0, 1 - bf * 3.5), s1 = Math.sin(bp * Math.PI), ab = Math.abs(s1);
  const o = { dy: 0, sq: 0, aL: .2, aR: .2, rot: 0, walk: null, sx: 1, dx: 0 };
  if (style === 'mix') style = ['bounce', 'roof', 'sway', 'spin', 'hop', 'wave'][(Math.floor(bp / 8) + seed) % 6];
  switch (style) {
    case 'bounce': o.dy = -ab * 1.6; o.sq = hit * .12; o.aL = .4 + s1; o.aR = .4 - s1; break;
    case 'hop': o.dy = -ab * 4; o.sq = hit * .18; o.aL = o.aR = .3 + ab * 1.1; break;
    case 'roof': o.dy = -ab * 1.2; o.sq = hit * .1; o.aL = o.aR = 1.25 + .3 * Math.sin(bp * TAU); break;
    case 'sway': o.dx = s1 * 3; o.rot = s1 * .12; o.aL = .5 + .6 * s1; o.aR = .5 - .6 * s1; o.sq = hit * .08; break;
    case 'spin': { const ph = (((bi % 4) + 4) % 4 === 3) ? bf : 0; o.sx = Math.cos(ph * TAU); o.dy = -Math.sin(ph * Math.PI) * 3 - ab; o.aL = o.aR = .6 + ph; o.sq = hit * .1; break; }
    case 'wave': o.dy = -ab; o.aL = 1.1 + .5 * Math.sin(bp * TAU * 2); o.aR = -.2; o.sq = hit * .08; break;

const SCENES = [

// ---------- render ----------
let debug = false; const taps = [];
function render(t) {

  c.lineCap = 'butt'; c.lineJoin = 'round'; c.globalAlpha = 1; c.setLineDash([]); c.shadowBlur = 0;

  try { fn(t, lt); } catch (err) { console.error('scene', idx, err); }
  c.restore();
  c.globalAlpha = 1; c.shadowBlur = 0; c.setLineDash([]);
  if (!intro && lt < .2 && idx > 0) { c.fillStyle = `rgba(255,255,255,${.45 * (1 - lt / .2)})`; c.fillRect(0, 0, W, H); }

  if (debug) {
    c.fillStyle = 'rgba(0,0,0,.7)'; c.fillRect(10, 10, 360, 70);
    c.fillStyle = '#7CFF9A'; font(16, 'P'); c.textAlign = 'left'; c.textBaseline = 'top';
    c.fillText(`t=${t.toFixed(2)}  beat=${BP.toFixed(2)}`, 20, 20); c.fillText(`scene #${idx} @ ${a}s  (T = tap)`, 20, 46);
  }
}

// ---------- clock + controls ----------
const clk = { ct: 0, at: 0 };
function now() {
  if (au.paused) return au.currentTime;
  const ct = au.currentTime, p = performance.now();
  if (ct !== clk.ct) { clk.ct = ct; clk.at = p; }
  return ct + Math.min(.25, (p - clk.at) / 1000);
}
function resize() { const r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2); const w = Math.max(320, Math.round(r.width * d)), h = Math.max(180, Math.round(r.height * d)); if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; } }
new ResizeObserver(resize).observe(cv); resize();

const playBtn = document.getElementById('play'), startBtn = document.getElementById('start'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), lyrBtn = document.getElementById('lyr'), tapsEl = document.getElementById('taps');
let dragging = false;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function begin() { started = true; startBtn.hidden = true; }
function toggle() { if (au.paused) { begin(); au.play().catch(() => {}); } else au.pause(); }
startBtn.addEventListener('click', () => { begin(); au.currentTime = 0; au.play().catch(() => {}); });
playBtn.addEventListener('click', toggle);
au.addEventListener('play', () => { playBtn.textContent = '❚❚ Pause'; });
au.addEventListener('pause', () => { playBtn.textContent = au.ended ? '↺ Replay' : '▶ Play'; });
au.addEventListener('loadedmetadata', () => { scrub.max = au.duration.toFixed(2); });
scrub.addEventListener('input', () => { dragging = true; begin(); au.currentTime = +scrub.value; });

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
  if (e.key === ' ') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') { begin(); au.currentTime = Math.min(au.duration || DUR, au.currentTime + 5); }
  else if (e.key === 'ArrowLeft') { begin(); au.currentTime = Math.max(0, au.currentTime - 5); }
  else if (e.key === 'l' || e.key === 'L') lyrBtn.click();
  else if (e.key === 'd' || e.key === 'D') { debug = !debug; tapsEl.hidden = !debug; }
  else if ((e.key === 't' || e.key === 'T') && debug) { taps.push(au.currentTime.toFixed(2)); tapsEl.textContent = 'taps: ' + taps.join(', '); }
});

function frame(ms) {
  rt = ms / 1000;
  const t = now();
  render(t);
  if (!dragging) scrub.value = t.toFixed(2);
  timeEl.textContent = `${fmt(t)} / ${fmt(au.duration || DUR)}`;
  requestAnimationFrame(frame);
}
window.__render = t => { started = true; render(t); };
window.__scenes = SCENES.map(s => s[0]);
requestAnimationFrame(frame);
})();
